# Pings the backend so Render's free plan doesn't put it to sleep after
# 15 idle minutes (the first visit after a sleep takes 30-60 seconds).
# /health doesn't touch the database, so Neon can still pause when idle.
name: Keep backend awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: |
          curl --fail --silent --show-error --max-time 90 \
            --retry 3 --retry-delay 10 --retry-all-errors \
            https://norman-retail-system.onrender.com/health
